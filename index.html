<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f1e1d">
<title>Hans AI Coder</title>
<style>
:root{--bg:#1f1e1d;--panel:#2b2a28;--panel2:#363431;--tx:#ece9e2;--mut:#a7a299;--acc:#e07b4f;--ok:#4caf7a;--bad:#e5645a;--line:#3d3b37}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100%;max-width:760px;margin:0 auto}
header{display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;border-bottom:1px solid var(--line)}
header .t{flex:1;min-width:0;text-align:center}
header .t b{display:block;font-size:16px}
header .t span{display:block;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:none;border:0;font-size:22px;width:42px;height:42px;border-radius:10px;color:var(--tx)}
.ib:active{background:var(--panel)}
#msgs{flex:1;overflow-y:auto;padding:12px 12px 4px;-webkit-overflow-scrolling:touch}
.m{margin:0 0 14px;display:flex}
.m.u{justify-content:flex-end}
.b{max-width:92%;padding:10px 13px;border-radius:16px;overflow-wrap:anywhere}
.u .b{background:var(--panel2);border-bottom-right-radius:5px}
.a .b{background:transparent;padding-left:0;max-width:100%;width:100%}
.b p{margin:0 0 8px}.b p:last-child{margin:0}
.b ul{margin:4px 0 8px;padding-left:20px}
.b h4{margin:8px 0 4px}
.b code{background:#0003;padding:1px 5px;border-radius:5px;font:13px ui-monospace,Menlo,Consolas,monospace}
.b pre{background:#151413;border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto;margin:6px 0}
.b pre code{background:none;padding:0;white-space:pre}
.steps{font-size:13px;color:var(--mut);margin:0 0 8px}
.steps div{padding:1px 0}
.err .b{color:var(--bad)}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--mut);animation:bl 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.prop{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.prop .ph{font-weight:800;margin-bottom:2px}
.prop .ps{color:var(--mut);font-size:14px;margin-bottom:8px}
.pf{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.pf .p{flex:1;min-width:0;overflow-wrap:anywhere}
.chip{font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px;text-transform:uppercase}
.chip.new{background:#1f4d36;color:#8fe0b3}.chip.modified{background:#4d3a1f;color:#f0c27a}.chip.deleted{background:#4d1f1f;color:#f0958f}
.lnk{background:none;border:0;color:var(--acc);font-weight:700;padding:6px}
.pd{background:#151413;border:1px solid var(--line);border-radius:10px;margin:4px 0 8px;overflow-x:auto;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
.pd div{white-space:pre;padding:0 8px;min-width:100%;width:max-content}
.pd .add{background:#16331f;color:#9be3b4}.pd .del{background:#3a1b19;color:#f0a39d}.pd .gap{color:var(--mut);background:#1d1c1a}
.hidden{display:none!important}
.pin{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin:8px 0 4px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut);margin:4px 0 8px}
.chk input{width:18px;height:18px;accent-color:var(--acc)}
.pb{display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:11px;padding:12px;font-weight:800;background:var(--panel2)}
.btn.ok{background:var(--ok);color:#06210f}
.btn.go{background:var(--acc);color:#2a1206}
.btn:disabled{opacity:.5}
.pst{font-size:14px;margin-top:8px}
.pst.good{color:var(--ok)}.pst.bad{color:var(--bad)}
.pst a{color:var(--acc)}
footer{display:flex;align-items:flex-end;gap:8px;padding:8px 10px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
#inp{flex:1;resize:none;max-height:140px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:11px 14px;outline:none}
#send{width:46px;height:46px;border-radius:50%;border:0;background:var(--acc);color:#2a1206;font-size:20px;font-weight:900;flex:none}
#send:disabled{opacity:.45}
.empty{color:var(--mut);text-align:center;margin-top:12vh;padding:0 20px}
.empty b{display:block;color:var(--tx);font-size:20px;margin-bottom:8px}
.sug{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.sug button{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px;text-align:left;color:var(--tx)}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sh{width:100%;max-width:760px;max-height:90%;overflow-y:auto;background:var(--panel);border-radius:18px 18px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom))}
.sh h3{margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.sh label{display:block;color:var(--mut);font-size:13px;font-weight:700;margin:10px 0 4px}
.sh input,.sh select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px}
.note{color:var(--mut);font-size:13px;margin:8px 0}
.st{font-size:14px;margin:8px 0}.st.good{color:var(--ok)}.st.bad{color:var(--bad)}
.crow{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.crow button.o{flex:1;text-align:left;background:none;border:0;padding:12px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow.on{border-color:var(--acc)}
.crow .x{background:none;border:0;color:var(--bad);padding:10px 12px;font-weight:900}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="ib" id="bChats" aria-label="Chats">☰</button>
    <div class="t"><b>Hans AI Coder</b><span id="chip"></span></div>
    <button class="ib" id="bNew" aria-label="New chat">＋</button>
    <button class="ib" id="bSet" aria-label="Settings">⚙</button>
  </header>
  <div id="msgs"></div>
  <footer>
    <textarea id="inp" rows="1" placeholder="Ask me to build or fix something…"></textarea>
    <button id="send" aria-label="Send">➤</button>
  </footer>
</div>
<div id="ov" class="ov hidden"><div class="sh" id="sh"></div></div>

<script>
(function () {
  var KEY = 'hans_ai_coder_v1';
  var D = null;
  try { D = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  if (!D || !D.settings) D = { settings: { url: '', pass: '', repo: '', branch: '' }, chats: [], cur: null };
  var busy = false;
  var $ = function (id) { return document.getElementById(id); };
  function save() { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) {} }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function uid() { return Date.now().toString(36) + Math.floor(Math.random() * 1e5).toString(36); }
  function chat() {
    var c = D.chats.filter(function (x) { return x.id === D.cur; })[0];
    if (!c) { c = { id: uid(), title: 'New chat', msgs: [] }; D.chats.unshift(c); D.cur = c.id; save(); }
    return c;
  }

  /* ---------- small markdown ---------- */
  function inline(p) {
    var h = esc(p).replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
    var out = '', list = false;
    h.split('\n').forEach(function (l) {
      var li = l.match(/^\s*(?:[-*]|\d+\.)\s+(.*)$/), hd = l.match(/^#{1,4}\s+(.*)$/);
      if (li) { if (!list) { out += '<ul>'; list = true; } out += '<li>' + li[1] + '</li>'; return; }
      if (list) { out += '</ul>'; list = false; }
      if (hd) out += '<h4>' + hd[1] + '</h4>'; else if (l.trim()) out += '<p>' + l + '</p>';
    });
    return out + (list ? '</ul>' : '');
  }
  function md(t) {
    return String(t || '').split('```').map(function (p, i) {
      if (i % 2) { var nl = p.indexOf('\n'), code = nl >= 0 && /^[\w+#.-]*$/.test(p.slice(0, nl)) ? p.slice(nl + 1) : p; return '<pre><code>' + esc(code.replace(/\n$/, '')) + '</code></pre>'; }
      return inline(p);
    }).join('');
  }

  /* ---------- line diff for the review screen ---------- */
  function lineDiff(a, b) {
    var A = a.split('\n'), B = b.split('\n'), n = A.length, m = B.length;
    if (n * m > 3e6) return null;
    var w = m + 1, T = new Uint16Array((n + 1) * w), i, j;
    for (i = n - 1; i >= 0; i--) for (j = m - 1; j >= 0; j--) T[i * w + j] = A[i] === B[j] ? T[(i + 1) * w + j + 1] + 1 : Math.max(T[(i + 1) * w + j], T[i * w + j + 1]);
    var out = []; i = 0; j = 0;
    while (i < n && j < m) {
      if (A[i] === B[j]) { out.push(['=', A[i]]); i++; j++; }
      else if (T[(i + 1) * w + j] >= T[i * w + j + 1]) { out.push(['-', A[i]]); i++; }
      else { out.push(['+', B[j]]); j++; }
    }
    while (i < n) out.push(['-', A[i++]]);
    while (j < m) out.push(['+', B[j++]]);
    return out;
  }
  function diffHtml(before, after) {
    var d = lineDiff(before, after);
    if (!d) return '<div class="gap">Big change: ' + before.split('\n').length + ' lines became ' + after.split('\n').length + ' lines.</div>';
    var keep = d.map(function (x, k) { if (x[0] !== '=') return true; for (var q = Math.max(0, k - 2); q <= Math.min(d.length - 1, k + 2); q++) if (d[q][0] !== '=') return true; return false; });
    var h = '', gap = false, shown = 0;
    d.forEach(function (x, k) {
      if (!keep[k]) { if (!gap) { h += '<div class="gap">…</div>'; gap = true; } return; }
      gap = false; if (++shown > 400) return;
      h += '<div class="' + (x[0] === '+' ? 'add' : x[0] === '-' ? 'del' : '') + '">' + (x[0] === '=' ? '  ' : x[0] + ' ') + esc(x[1]) + '</div>';
    });
    return h || '<div class="gap">No changes</div>';
  }
  function block(t, cls, max) {
    var L = String(t).split('\n'), cut = L.length > max;
    return (cut ? L.slice(0, max) : L).map(function (l) { return '<div class="' + cls + '">' + (cls === 'add' ? '+ ' : '- ') + esc(l) + '</div>'; }).join('') + (cut ? '<div class="gap">… ' + (L.length - max) + ' more lines</div>' : '');
  }
  function fileDiff(f) {
    if (f.status === 'deleted') return '<div class="del">- This file will be deleted</div>';
    if (f.edits) return f.edits.map(function (e) { return block(e.find, 'del', 40) + block(e.replace, 'add', 40) + '<div class="gap">…</div>'; }).join('');
    if (f.status === 'new') return block(f.content || '', 'add', 80);
    return f.before != null ? diffHtml(f.before, f.content || '') : block(f.content || '', 'add', 60);
  }

  /* ---------- screens ---------- */
  function chipText() { var s = D.settings; return s.repo ? s.repo + (s.branch ? ' · ' + s.branch : '') : 'No repository chosen'; }
  var SUG = ['Show me the files in this repo', 'Find a bug in my code and fix it', 'Add a dark mode to my website'];
  function propHtml(p, i) {
    var h = '<div class="prop"><div class="ph">📝 Proposed changes</div><div class="ps">' + esc(p.summary) + '</div>';
    p.files.forEach(function (f, k) {
      var tag = f.edits ? 'edit' : f.status;
      h += '<div class="pf"><span class="chip ' + f.status + '">' + esc(tag) + '</span><span class="p">' + esc(f.path) + '</span><button class="lnk" data-a="view" data-i="' + i + '" data-k="' + k + '">View</button></div><div class="pd hidden" id="d' + i + '_' + k + '">' + fileDiff(f) + '</div>';
    });
    if (p.state === 'pending') {
      h += '<input class="pin" id="cm' + i + '" value="' + esc(p.summary.slice(0, 70)) + '" aria-label="Commit message">';
      h += '<label class="chk"><input type="checkbox" id="nb' + i + '"> Push to a new branch, not ' + esc(D.settings.branch || 'the main branch') + '</label>';
      h += '<div class="pb"><button class="btn ok" data-a="ok" data-i="' + i + '"' + (p.working ? ' disabled' : '') + '>' + (p.working ? 'Pushing…' : '✅ Approve and push') + '</button><button class="btn" data-a="no" data-i="' + i + '"' + (p.working ? ' disabled' : '') + '>❌ Reject</button></div>';
      if (p.error) h += '<div class="pst bad">⚠️ ' + esc(p.error) + '</div>';
    } else if (p.state === 'pushed') h += '<div class="pst good">✅ Pushed to ' + esc(p.branch || '') + ' · <a href="' + esc(p.url) + '" target="_blank" rel="noopener">View commit</a></div>';
    else h += '<div class="pst">❌ Rejected. Nothing was pushed.</div>';
    return h + '</div>';
  }
  function render() {
    var c = chat(), box = $('msgs'), h = '';
    $('chip').textContent = chipText();
    if (!c.msgs.length) {
      h = '<div class="empty"><b>What shall we build?</b>I can read your GitHub code, change it, and push it after you approve.' + (D.settings.url ? '' : '<br><br>First tap ⚙ and connect your Worker.') +
        '<div class="sug">' + SUG.map(function (s) { return '<button data-a="sug" data-t="' + esc(s) + '">' + esc(s) + '</button>'; }).join('') + '</div></div>';
    }
    c.msgs.forEach(function (m, i) {
      if (m.role === 'user') h += '<div class="m u"><div class="b">' + esc(m.text).replace(/\n/g, '<br>') + '</div></div>';
      else {
        h += '<div class="m a' + (m.error ? ' err' : '') + '"><div class="b">';
        if (m.steps && m.steps.length) h += '<div class="steps">' + m.steps.map(function (s) { return '<div>' + esc(s) + '</div>'; }).join('') + '</div>';
        h += md(m.text) + (m.proposal ? propHtml(m.proposal, i) : '') + '</div></div>';
      }
    });
    if (busy) h += '<div class="m a"><div class="b"><span class="dots"><span></span><span></span><span></span></span> <span style="color:var(--mut);font-size:14px">Working…</span></div></div>';
    box.innerHTML = h;
    box.scrollTop = box.scrollHeight;
    $('send').disabled = busy;
  }

  /* ---------- talking to the Worker ---------- */
  async function api(path, body) {
    var s = D.settings, ctl = new AbortController(), to = setTimeout(function () { ctl.abort(); }, 150000);
    try {
      var res = await fetch(s.url.replace(/\/+$/, '') + path, { method: body ? 'POST' : 'GET', headers: { 'content-type': 'application/json', 'x-app-pass': s.pass }, body: body ? JSON.stringify(body) : undefined, signal: ctl.signal });
      var j = await res.json().catch(function () { return {}; });
      if (!res.ok || (j.error && !j.reply)) throw new Error(j.error || 'Error ' + res.status);
      return j;
    } catch (e) {
      if (e.name === 'AbortError') throw new Error('That took too long. Try a smaller task.');
      if (e instanceof TypeError) throw new Error('Cannot reach the Worker. Check its address and your internet.');
      throw e;
    } finally { clearTimeout(to); }
  }
  function history(c) {
    return c.msgs.filter(function (m) { return !m.error; }).slice(-16).map(function (m) {
      var t = m.text;
      if (m.proposal) t += '\n(' + (m.proposal.state === 'pushed' ? 'The user approved this proposal and it was pushed.' : m.proposal.state === 'rejected' ? 'The user rejected this proposal.' : 'This proposal is waiting for the user to approve it.') + ')';
      return { role: m.role, text: t };
    });
  }
  async function send(text) {
    var t = (text || $('inp').value).trim(); if (!t || busy) return;
    if (!D.settings.url || !D.settings.pass) { openSettings(); return; }
    var c = chat(); c.msgs.push({ role: 'user', text: t }); if (c.title === 'New chat') c.title = t.slice(0, 40);
    $('inp').value = ''; grow(); busy = true; save(); render();
    try {
      var r = await api('/chat', { repo: D.settings.repo, branch: D.settings.branch, messages: history(c) });
      c.msgs.push({ role: 'assistant', text: r.reply || 'Done.', steps: r.steps || [], proposal: r.proposal ? { summary: r.proposal.summary, files: r.proposal.files, state: 'pending' } : null });
    } catch (e) { c.msgs.push({ role: 'assistant', text: '⚠️ ' + e.message, error: true }); }
    busy = false; save(); render();
  }
  async function approve(i) {
    var c = chat(), m = c.msgs[i], p = m && m.proposal; if (!p || p.working) return;
    var msg = ($('cm' + i) && $('cm' + i).value.trim()) || p.summary, nb = $('nb' + i) && $('nb' + i).checked;
    p.working = true; p.error = ''; render();
    try {
      var files = p.files.map(function (f) { return { path: f.path, status: f.status, edits: f.edits, content: f.content }; });
      var r = await api('/push', { repo: D.settings.repo, branch: D.settings.branch, message: msg, newBranch: nb ? 'ai/' + msg.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 30) + '-' + Date.now().toString(36).slice(-4) : '', files: files });
      p.state = 'pushed'; p.url = r.url; p.branch = r.branch;
    } catch (e) { p.error = e.message; }
    p.working = false; save(); render();
  }

  /* ---------- sheets: settings and chats ---------- */
  function sheet(html) { $('sh').innerHTML = html; $('ov').classList.remove('hidden'); }
  function closeSheet() { $('ov').classList.add('hidden'); }
  var repos = [];
  function repoOptions() {
    var s = D.settings, list = repos.length ? repos : (s.repo ? [{ name: s.repo, branch: s.branch }] : []);
    return '<option value="">Choose a repository…</option>' + list.map(function (r) { return '<option value="' + esc(r.name) + '" data-b="' + esc(r.branch) + '"' + (r.name === s.repo ? ' selected' : '') + '>' + esc(r.name) + (r.private ? ' 🔒' : '') + '</option>'; }).join('');
  }
  function openSettings(msg, cls) {
    var s = D.settings;
    sheet('<h3>⚙ Settings <button class="ib" data-a="close">✕</button></h3>' +
      '<div class="note">Deploy the Worker first (see the README). Then paste its address and your passcode.</div>' +
      '<label>Worker address</label><input id="sUrl" type="url" placeholder="https://hans-ai-coder.yourname.workers.dev" value="' + esc(s.url) + '" autocomplete="off">' +
      '<label>Passcode</label><input id="sPass" type="password" value="' + esc(s.pass) + '" autocomplete="off">' +
      '<div style="margin-top:10px"><button class="btn go" style="width:100%" data-a="connect">Connect and load my repositories</button></div>' +
      '<div class="st ' + (cls || '') + '" id="sMsg">' + esc(msg || '') + '</div>' +
      '<label>Repository to work on</label><select id="sRepo">' + repoOptions() + '</select>' +
      '<label>Branch</label><input id="sBranch" value="' + esc(s.branch) + '" placeholder="main" autocomplete="off">' +
      '<div style="margin-top:12px"><button class="btn ok" style="width:100%" data-a="saveset">Save</button></div>');
  }
  async function connect() {
    D.settings.url = $('sUrl').value.trim(); D.settings.pass = $('sPass').value; save();
    $('sMsg').className = 'st'; $('sMsg').textContent = 'Connecting…';
    try {
      var p = await api('/ping'); var r = await api('/repos', {});
      repos = r.repos || [];
      openSettings('✅ Connected. ' + (p.ai ? '' : 'The AI key is missing. ') + (p.github ? '' : 'The GitHub token is missing. ') + repos.length + ' repositories found.', p.ai && p.github ? 'good' : 'bad');
    } catch (e) { openSettings('⚠️ ' + e.message, 'bad'); }
  }
  function saveSettings() {
    var sel = $('sRepo'), opt = sel.options[sel.selectedIndex], s = D.settings;
    s.url = $('sUrl').value.trim(); s.pass = $('sPass').value; s.repo = sel.value;
    var b = $('sBranch').value.trim(); s.branch = b || (opt && opt.dataset.b) || 'main';
    save(); closeSheet(); render();
  }
  function openChats() {
    sheet('<h3>Chats <button class="ib" data-a="close">✕</button></h3>' +
      '<button class="btn go" style="width:100%;margin-bottom:10px" data-a="newchat">＋ New chat</button>' +
      D.chats.map(function (c) { return '<div class="crow' + (c.id === D.cur ? ' on' : '') + '"><button class="o" data-a="open" data-id="' + c.id + '">' + esc(c.title) + '</button><button class="x" data-a="del" data-id="' + c.id + '" aria-label="Delete chat">✕</button></div>'; }).join(''));
  }

  /* ---------- events ---------- */
  function grow() { var t = $('inp'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 140) + 'px'; }
  $('inp').addEventListener('input', grow);
  $('inp').addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(pointer:fine)').matches) { e.preventDefault(); send(); } });
  $('send').addEventListener('click', function () { send(); });
  $('bSet').addEventListener('click', function () { openSettings(); });
  $('bChats').addEventListener('click', openChats);
  $('bNew').addEventListener('click', function () { var c = { id: uid(), title: 'New chat', msgs: [] }; D.chats.unshift(c); D.cur = c.id; save(); render(); });
  $('ov').addEventListener('click', function (e) { if (e.target === $('ov')) closeSheet(); });
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-a]'); if (!b) return;
    var a = b.dataset.a, i = +b.dataset.i;
    if (a === 'close') closeSheet();
    else if (a === 'connect') connect();
    else if (a === 'saveset') saveSettings();
    else if (a === 'view') { var d = $('d' + i + '_' + b.dataset.k); if (d) { d.classList.toggle('hidden'); b.textContent = d.classList.contains('hidden') ? 'View' : 'Hide'; } }
    else if (a === 'ok') approve(i);
    else if (a === 'no') { var p = chat().msgs[i].proposal; if (p) { p.state = 'rejected'; save(); render(); } }
    else if (a === 'sug') send(b.dataset.t);
    else if (a === 'newchat') { $('bNew').click(); closeSheet(); }
    else if (a === 'open') { D.cur = b.dataset.id; save(); closeSheet(); render(); }
    else if (a === 'del') { D.chats = D.chats.filter(function (c) { return c.id !== b.dataset.id; }); if (D.cur === b.dataset.id) D.cur = null; save(); render(); openChats(); }
  });
  render();
  if (!D.settings.url) setTimeout(function () { openSettings('Welcome! Connect your Worker to begin.'); }, 300);
})();
</script>
